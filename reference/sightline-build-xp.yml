name: Build Sightline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_ARCHIVE_URL: https://github.com/lighterowl/qt563xp/releases/download/1.2/Qt-5.6.3-Static-XP.7z
  QT_ROOT: C:\Qt\5.6.3-Static-XP
  VS2017_PATH: C:\BuildTools2017

jobs:
  quickjs:
    name: qjs.exe (QuickJS para XP)
    runs-on: windows-2022
    timeout-minutes: 30
    # Best effort. Sightline runs without qjs.exe by falling back to yt-dlp's
    # own Python interpreter, so a toolchain that will not cooperate must not
    # take the whole release with it.
    continue-on-error: true

    steps:
      - name: Fetch quickjs-ng
        uses: actions/checkout@v4
        with:
          repository: quickjs-ng/quickjs
          ref: v0.10.1
          path: quickjs

      - name: Install 32-bit MinGW (MSVCRT)
        shell: pwsh
        run: |
          # MSVCRT rather than UCRT: the UCRT runtime needs a Windows update
          # that a stock XP install does not have, and the point of this
          # binary is that it runs on a stock XP install.
          # MSYS2 dropped its 32-bit environment, so the toolchain comes from
          # winlibs as a standalone archive instead.
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/13.2.0-16.0.6-11.0.0-msvcrt-r1/winlibs-i686-posix-dwarf-gcc-13.2.0-mingw-w64msvcrt-11.0.0-r1.7z"
          Invoke-WebRequest -Uri $url -OutFile "${env:RUNNER_TEMP}\mingw32.7z"
          & "C:\Program Files\7-Zip\7z.exe" x "${env:RUNNER_TEMP}\mingw32.7z" "-oC:\" -y
          if (-not (Test-Path "C:\mingw32\bin\gcc.exe")) { throw "gcc.exe not found after extraction" }
          & "C:\mingw32\bin\gcc.exe" --version

      - name: Configure
        shell: cmd
        run: |
          set PATH=C:\mingw32\bin;%PATH%
          cd quickjs
          cmake -S . -B build -G "MinGW Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=C:/mingw32/bin/gcc.exe ^
            -DCMAKE_MAKE_PROGRAM=C:/mingw32/bin/mingw32-make.exe ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DBUILD_EXAMPLES=OFF ^
            -DBUILD_QJS_LIBC=ON ^
            -DCMAKE_C_FLAGS="-D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -DNTDDI_VERSION=0x05010000 -O2 -msse2 -mfpmath=sse" ^
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -Wl,--major-subsystem-version,5 -Wl,--minor-subsystem-version,1"

      - name: Build
        shell: cmd
        run: |
          set PATH=C:\mingw32\bin;%PATH%
          cd quickjs
          cmake --build build --config Release --target qjs -j 4

      - name: Verify the binary would start on XP
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "${env:GITHUB_WORKSPACE}\quickjs\build" -Filter qjs.exe -Recurse |
                 Select-Object -First 1
          if (-not $exe) { throw "qjs.exe was not produced" }

          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $major = [BitConverter]::ToUInt16($bytes, $peOffset + 0x48)
          $minor = [BitConverter]::ToUInt16($bytes, $peOffset + 0x4A)
          Write-Host "Machine: 0x$($machine.ToString('X4'))  Subsystem: $major.$minor  Size: $([math]::Round($exe.Length / 1MB, 1)) MB"
          if ($machine -ne 0x014C) { throw "Expected a 32-bit binary, got machine 0x$($machine.ToString('X4'))" }
          if ($major -ne 5 -or $minor -ne 1) { throw "Expected subsystem 5.1, got $major.$minor" }

          # Linking is not the same as running. These are the imports that
          # actually break on XP, and finding one here is far cheaper than
          # finding it as a "not a valid Win32 application" box later.
          $strings = [System.Text.Encoding]::ASCII.GetString($bytes)
          $forbidden = @(
            "GetTickCount64", "InitOnceExecuteOnce", "InitializeConditionVariable",
            "SleepConditionVariableCS", "WakeAllConditionVariable",
            "GetFileInformationByHandleEx", "GetSystemTimePreciseAsFileTime",
            "InitializeCriticalSectionEx", "CreateThreadpoolTimer",
            "SetFileInformationByHandle", "GetFinalPathNameByHandleW",
            "AcquireSRWLockExclusive", "K32GetProcessMemoryInfo"
          )
          $hits = $forbidden | Where-Object { $strings.Contains($_) }
          if ($hits) {
            Write-Host "::warning::qjs.exe imports APIs that XP does not have: $($hits -join ', ')"
            Write-Host "::warning::It will still be published, but it may refuse to start on XP."
          } else {
            Write-Host "No Vista-or-later imports found."
          }

          New-Item -ItemType Directory -Path "${env:GITHUB_WORKSPACE}\qjs-out" -Force | Out-Null
          Copy-Item $exe.FullName "${env:GITHUB_WORKSPACE}\qjs-out\qjs.exe"

      - name: Upload qjs.exe
        uses: actions/upload-artifact@v4
        with:
          name: qjs-xp
          path: qjs-out\qjs.exe
          if-no-files-found: error

  sightline:
    name: Sightline.exe
    runs-on: windows-2022
    timeout-minutes: 55
    needs: quickjs
    env:
      BUILD_DIR: ${{ github.workspace }}\build

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Qt
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${env:QT_ARCHIVE_URL}" -OutFile "${env:RUNNER_TEMP}\qt-xp.7z"

      - name: Extract Qt
        shell: pwsh
        run: |
          if (Test-Path "${env:QT_ROOT}") { Remove-Item "${env:QT_ROOT}" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\Qt" -Force | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x "${env:RUNNER_TEMP}\qt-xp.7z" "-oC:\Qt" -y
          $qmake = "${env:QT_ROOT}\bin\qmake.exe"
          $spec = "${env:QT_ROOT}\mkspecs\win32-msvc2017\qmake.conf"
          if (-not (Test-Path $qmake)) { throw "qmake.exe was not found at $qmake" }
          if (-not (Test-Path $spec)) { throw "qmake.conf was not found at $spec" }
          & $qmake -v

      - name: Unpack FFmpeg runtime DLLs
        shell: pwsh
        run: |
          $ffmpeg = Join-Path $env:GITHUB_WORKSPACE "third_party\ffmpeg"
          if (-not (Test-Path $ffmpeg)) { throw "third_party/ffmpeg is missing from the checkout" }

          Write-Host "--- third_party/ffmpeg before unpacking ---"
          Get-ChildItem -Path $ffmpeg -Recurse -File |
            ForEach-Object { Write-Host ("  {0,-40} {1,10:N0} bytes" -f $_.FullName.Substring($ffmpeg.Length + 1), $_.Length) }

          # Archives are searched for recursively and by several extensions:
          # the DLL that exceeds GitHub's file limit can be shipped as .7z,
          # .zip or a split .7z.001, and it need not sit in the root.
          $patterns = @("*.7z", "*.7z.001", "*.zip")
          $archives = @()
          foreach ($pattern in $patterns) {
            $archives += Get-ChildItem -Path $ffmpeg -Filter $pattern -Recurse -File -ErrorAction SilentlyContinue
          }

          if ($archives.Count -eq 0) {
            Write-Host "No archives found under third_party/ffmpeg; assuming the DLLs are already unpacked."
          }

          foreach ($archive in $archives) {
            # A file checked in through Git LFS without lfs:true on checkout
            # arrives as a ~130 byte text pointer. 7-Zip would report a vague
            # format error, so it is named here instead.
            if ($archive.Length -lt 1024) {
              $head = Get-Content $archive.FullName -TotalCount 1 -ErrorAction SilentlyContinue
              if ($head -like "version https://git-lfs*") {
                throw "$($archive.Name) is a Git LFS pointer, not the archive. Commit the real file or enable LFS."
              }
              throw "$($archive.Name) is only $($archive.Length) bytes; it is not a usable archive."
            }

            Write-Host "Extracting $($archive.Name) ($([math]::Round($archive.Length / 1MB, 1)) MB)"
            & "C:\Program Files\7-Zip\7z.exe" x $archive.FullName "-o$ffmpeg" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw "7-Zip failed on $($archive.Name) with exit code $LASTEXITCODE" }
          }

          # An archive may carry its DLL inside bin/ or another folder, so
          # anything found below the root is lifted up to sit beside the
          # executable, which is where the loader will look for it.
          Get-ChildItem -Path $ffmpeg -Filter *.dll -Recurse -File |
            Where-Object { $_.DirectoryName -ne $ffmpeg } |
            ForEach-Object {
              Write-Host "Moving $($_.Name) up from $($_.Directory.Name)/"
              Move-Item $_.FullName (Join-Path $ffmpeg $_.Name) -Force
            }

          Write-Host "--- DLLs present after unpacking ---"
          $found = Get-ChildItem -Path $ffmpeg -Filter *.dll -File
          if ($found.Count -eq 0) { Write-Host "  (none)" }
          $found | ForEach-Object { Write-Host ("  {0,-24} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB)) }

          $required = @("avcodec-61.dll", "avformat-61.dll", "avutil-59.dll", "swscale-8.dll", "swresample-5.dll")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $ffmpeg $_)) }
          if ($missing) {
            Write-Host "::error::Missing FFmpeg runtime DLLs: $($missing -join ', ')"
            throw "Missing FFmpeg runtime DLLs: $($missing -join ', '). Check the listing above for what the archive actually contained."
          }

      - name: Install Visual Studio 2017 XP build tools
        shell: pwsh
        run: |
          $bootstrapper = "${env:RUNNER_TEMP}\vs_buildtools_2017.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/15/release/vs_buildtools.exe" -OutFile $bootstrapper
          $arguments = @(
            "--quiet",
            "--wait",
            "--norestart",
            "--nocache",
            "--installPath", "${env:VS2017_PATH}",
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--add", "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.WinXP"
          )
          $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "VS 2017 Build Tools installer failed with exit code $($process.ExitCode)" }

      - name: Generate Makefile
        shell: cmd
        run: |
          call "%VS2017_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if exist "%BUILD_DIR%" rmdir /S /Q "%BUILD_DIR%"
          mkdir "%BUILD_DIR%"
          cd /d "%BUILD_DIR%"
          "%QT_ROOT%\bin\qmake.exe" -spec "%QT_ROOT%\mkspecs\win32-msvc2017" ..\Sightline.pro CONFIG+=release
          if not exist Makefile exit /b 1

      - name: Build
        shell: cmd
        run: |
          call "%VS2017_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd /d "%BUILD_DIR%"
          nmake

      - name: Verify XP subsystem version
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "${env:BUILD_DIR}" -Filter Sightline.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Sightline.exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $major = [BitConverter]::ToUInt16($bytes, $peOffset + 0x48)
          $minor = [BitConverter]::ToUInt16($bytes, $peOffset + 0x4A)
          Write-Host "Subsystem version: $major.$minor"
          if ($major -ne 5 -or $minor -ne 1) { throw "Expected subsystem 5.1 for Windows XP, got $major.$minor" }

      - name: Stage release layout
        shell: pwsh
        run: |
          $stage = "${env:GITHUB_WORKSPACE}\stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $exe = Get-ChildItem -Path "${env:BUILD_DIR}" -Filter Sightline.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName "$stage\Sightline.exe"
          Copy-Item "${env:GITHUB_WORKSPACE}\README.md" "$stage\LEEME.md" -ErrorAction SilentlyContinue
          # The DLLs ride next to the executable. Without them Sightline.exe
          # dies on load with a missing-module box that names avcodec and
          # nothing else, so a build that produced no DLLs must not ship.
          $dlls = Get-ChildItem -Path "${env:GITHUB_WORKSPACE}\third_party\ffmpeg" -Filter *.dll
          if ($dlls.Count -eq 0) { throw "No FFmpeg DLLs to stage" }
          $dlls | ForEach-Object { Copy-Item $_.FullName $stage }
          Write-Host "Staged: $((Get-ChildItem $stage | Measure-Object).Count) files"

      - name: Add qjs.exe if it was built
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qjs-xp
          path: stage

      - name: Report what is being shipped
        shell: pwsh
        run: |
          $stage = "${env:GITHUB_WORKSPACE}\stage"
          Get-ChildItem $stage -File | ForEach-Object {
            Write-Host ("  {0,-26} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }
          if (Test-Path (Join-Path $stage "qjs.exe")) {
            Write-Host "qjs.exe included: yt-dlp will use the native JS engine."
          } else {
            Write-Host "::warning::qjs.exe was not built. yt-dlp will fall back to its internal interpreter, which is slower."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Sightline-Windows-XP-x86
          path: stage\**
          if-no-files-found: error
